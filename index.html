<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Journey</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14284b;--navy2:#1e3a6e;--sky:#dbeafe;--sky2:#93c5fd;--bg:#f3f5f9;--card:#fff;--text:#14284b;--mute:#5b6b86;--line:#e3e8f0;--ok:#16a34a;--warn:#f59e0b;--err:#dc2626;--side:#14284b;--sidetext:#cfdcf5;--active:#ffffff22;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#bcd3fb;--navy2:#93c5fd;--sky:#1d2f52;--bg:#0c1424;--card:#131f36;--text:#e8eefb;--mute:#93a4c4;--line:#22314f;--side:#0a111f;--active:#ffffff18;color-scheme:dark}}
:root[data-theme="dark"]{--navy:#bcd3fb;--navy2:#93c5fd;--sky:#1d2f52;--bg:#0c1424;--card:#131f36;--text:#e8eefb;--mute:#93a4c4;--line:#22314f;--side:#0a111f;--active:#ffffff18;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky2);outline-offset:2px}
.app{display:flex;min-height:100vh}
.side{width:236px;background:var(--side);color:var(--sidetext);padding:24px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:19px;margin:0 8px 22px}
.brand i{width:34px;height:34px;border-radius:10px;background:#93c5fd;color:#14284b;display:grid;place-items:center;font-style:normal;font-weight:700}
.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:inherit;background:none;border:0;text-align:left;width:100%;font-size:16px}
.nav:hover{background:var(--active)}
.nav[aria-current=page]{background:var(--active);color:#fff;font-weight:700}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
main{flex:1;min-width:0;padding:32px;max-width:1040px;margin:0 auto;width:100%}
h1{font-size:28px;margin:0 0 4px;line-height:1.3}
h2{font-size:19px;margin:0 0 12px}
p{margin:0}
.mute{color:var(--mute)}
.top{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.av{width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--card);display:grid;place-items:center;font-weight:700;font-size:20px;flex-shrink:0}
.badge{display:inline-block;background:var(--sky);color:var(--navy);border-radius:99px;padding:2px 12px;font-size:14px;font-weight:700}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1.4fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 1px 3px rgba(20,40,75,.06)}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{color:var(--mute);font-size:14px}
.bar{height:12px;background:var(--sky);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>div{height:100%;background:var(--navy2);border-radius:99px;transition:width .6s ease}
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--sky2);flex-shrink:0;display:grid;place-items:center}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3}
.btn{background:var(--navy);color:var(--card);border:0;border-radius:12px;padding:12px 20px;font-weight:700;min-height:44px}
.btn:hover{background:var(--navy2)}
.btn.ghost{background:var(--sky);color:var(--navy)}
.week{display:flex;gap:8px;align-items:flex-end;height:120px;margin-top:8px}
.week div{flex:1;text-align:center;font-size:13px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px}
.week i{display:block;background:var(--sky2);border-radius:8px 8px 4px 4px;min-height:6px}
.quote{border-left:4px solid var(--sky2);padding-left:14px}
.quote em{font-style:normal;font-weight:700;font-size:18px;display:block}
.item{display:flex;gap:14px;align-items:flex-start}
.item .ic{margin-top:3px;color:var(--navy2)}
.tag{margin-left:auto;font-size:13px;white-space:nowrap;background:var(--sky);color:var(--navy);padding:2px 10px;border-radius:99px;align-self:flex-start}
.field{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
input[type=text],select{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;max-width:180px}
.sw{position:relative;width:52px;height:30px;border-radius:99px;border:0;background:var(--line);padding:0;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked=true]{background:var(--ok)}
.sw[aria-checked=true]::after{transform:translateX(22px)}
.bottom{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--navy);color:var(--card);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.on{opacity:1}
@media (max-width:860px){
.side{display:none}
main{padding:20px 16px 110px}
.g4{grid-template-columns:repeat(2,1fr)}
.g2,.g3{grid-template-columns:1fr}
h1{font-size:23px}
.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.bottom button{flex:1;background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;min-height:52px;border-radius:12px}
.bottom button[aria-current=page]{color:var(--navy);font-weight:700}
.bottom button[aria-current=page] svg{background:var(--sky);border-radius:99px;padding:3px;width:32px;height:26px}
.toast{bottom:100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:8px 14px;min-height:40px}.chip[aria-pressed=true]{background:var(--navy);color:var(--card);border-color:var(--navy)}.row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}.rb{flex:1;text-align:left;background:none;border:0;color:var(--text);padding:8px 0;font-size:16px;line-height:1.5;min-height:44px}.ib{background:var(--sky);color:var(--navy);border:0;border-radius:10px;padding:8px 12px;min-height:44px}.wh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.sec{margin-top:18px}.sec h2{font-size:15px;color:var(--mute);margin-bottom:2px}input[type=search]{font:inherit;width:100%;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:46px}.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .chip{flex:0 0 auto}.rowb{width:100%;background:none;border:0;border-top:1px solid var(--line);border-radius:0;font:inherit;text-align:left;color:var(--text);padding:0}.rowb .rb{color:inherit;pointer-events:none}.rowb.soon{color:var(--mute)}.rowb:hover{background:var(--bg)}.opt{border-radius:14px;text-align:left;font-size:17px;line-height:1.4;padding:12px 14px}.opt.ok{background:rgba(22,163,74,.18);border-color:var(--ok)}.opt.no{background:rgba(220,38,38,.16);border-color:var(--err)}
</style>
</head>
<body>
<div class="app">
<nav class="side" id="side" aria-label="主要導覽"></nav>
<main id="main"></main>
</div>
<nav class="bottom" id="bottom" aria-label="主要導覽"></nav>
<div class="toast" id="toast" role="status"></div>
<script>
const KEY='ej_state_v1';
const DEF={name:'學習者',level:'A1',goal:10,xp:0,streak:0,words:0,today:0,week:[0,0,0,0,0,0,0],tasks:[false,false,false,false,false],theme:''};
let S=load();
function load(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {...DEF}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const IP={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
learn:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 21V5"/>',
practice:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
progress:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/>',
check:'<path d="M5 12l5 5 9-10"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IP[n]}</svg>`;
const NAV=[['home','首頁'],['learn','學習'],['practice','練習'],['progress','進度'],['profile','個人']];
const LEVELS=['A1','A2','B1','B2','C1'];
const LV_NAME={A1:'入門',A2:'基礎',B1:'中級',B2:'中高級',C1:'進階'};
const QUOTES=[['Small steps every day lead to big progress.','每天一小步，累積成大進步。'],['Mistakes are proof that you are trying.','犯錯代表你正在努力嘗試。'],['Consistency beats intensity.','持續比強度更重要。'],['Learn a little, review a lot.','少量學習，多多複習。'],['Today’s effort is tomorrow’s fluency.','今天的努力，就是明天的流利。']];
const TASKS=['學習 10 個新單字','複習先前學過的單字','完成一個聽力練習','完成一個文法練習','完成一次小測驗'];
const LEARN=[['單字 A1–C1','五個難度級別，另含日常、學術、商業、多益、旅遊、科技、工程分類','第 2 階段'],['文法課程','從名詞、動詞到時態、被動語態與假設語氣','第 5 階段'],['聽力中心','字母數字、日常對話、新聞到學術講座','第 5 階段'],['口說中心','單字與句子發音、錄音與口說練習','第 5 階段'],['閱讀中心','附中文翻譯與點字查詢的短文','第 5 階段'],['寫作中心','句子、段落、電子郵件與短文練習','第 5 階段']];
const MODES=['單字卡','選擇題','配對遊戲','聽力測驗','拼字測驗','填空題','句子排序','中翻英','英翻中','圖片單字','極速挑戰','每日複習'];
const DAYS=['日','一','二','三','四','五','六'];
function route(){const h=location.hash.slice(1);return NAV.some(n=>n[0]===h)?h:'home'}
function navHtml(cur,kind){return NAV.map(([k,t])=>`<button class="nav-b ${kind}" data-go="${k}" ${k===cur?'aria-current="page"':''}>${ic(k)}<span>${t}</span></button>`).join('')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
function setTheme(){const r=document.documentElement;S.theme?r.setAttribute('data-theme',S.theme):r.removeAttribute('data-theme')}
function greet(){const h=new Date().getHours();return h<12?'早安':h<18?'午安':'晚安'}
function home(){
const pct=Math.min(100,Math.round(S.today/S.goal*100));
const done=S.tasks.filter(Boolean).length;
const q=QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length];
const wk=Math.max(1,...S.week);
const dow=new Date().getDay();
const wkHtml=S.week.map((v,i)=>`<div><i style="height:${Math.max(6,v/wk*80)}px"></i>${DAYS[(dow-6+i+7)%7]}</div>`).join('');
const tasks=TASKS.map((t,i)=>`<div class="task"><span class="chk ${S.tasks[i]?'on':''}">${S.tasks[i]?'<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>':''}</span><span>${t}</span></div>`).join('');
return `<div class="top"><div class="av" aria-hidden="true">${[...S.name][0]||'學'}</div><div><h1>${greet()}，${esc(S.name)}</h1><span class="badge">目前程度 ${S.level} · ${LV_NAME[S.level]}</span></div></div>
<div class="grid g4" style="margin-bottom:16px">
<div class="card stat"><b>${S.words}</b><span>已學單字</span></div>
<div class="card stat"><b>${S.xp}</b><span>總經驗值 XP</span></div>
<div class="card stat"><b>${S.streak} 天</b><span>連續學習</span></div>
<div class="card stat"><b>${S.level}</b><span>英文程度</span></div></div>
<div class="grid g2" style="margin-bottom:16px">
<div class="card"><h2>今日目標</h2><p class="mute">今天學習 ${S.today} / ${S.goal} 個單字</p><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div><p class="mute" style="font-size:14px">${pct}% 完成</p>
<h2 style="margin-top:18px">每日任務 <span class="mute" style="font-size:14px;font-weight:400">${done}/5</span></h2>${tasks}</div>
<div class="grid" style="align-content:start">
<div class="card"><h2>繼續學習</h2>${contH()}</div>
<div class="card"><h2>本週學習統計</h2><div class="week">${wkHtml}</div></div></div></div>
<div class="grid g2" style="grid-template-columns:1fr 1fr">
<div class="card"><h2>推薦課程</h2>${recH()}</div>
<div class="card quote"><h2>每日激勵</h2><em>${q[0]}</em><p class="mute">${q[1]}</p></div></div>`}
function learn(){return `<h1>學習</h1><p class="mute" style="margin-bottom:20px">所有課程內容會依開發階段逐步開放。</p><div class="grid g2" style="grid-template-columns:1fr 1fr">${LEARN.map(l=>`<div class="card item">${ic('learn')}<div><b>${l[0]}</b><p class="mute" style="font-size:14px">${l[1]}</p></div><span class="tag">${l[2]}</span></div>`).join('')}</div>`}
function practice(){return `<h1>練習</h1><p class="mute" style="margin-bottom:20px">12 種單字練習模式，將於第 3 階段開放。</p><div class="grid g3">${MODES.map((m,i)=>`<div class="card item">${ic('practice')}<div><b>${m}</b><p class="mute" style="font-size:13px">第 3 階段</p></div></div>`).join('')}</div>`}
function progress(){const wk=S.week.reduce((a,b)=>a+b,0);return `<h1>進度</h1><p class="mute" style="margin-bottom:20px">學習紀錄會從你的第一次練習開始累積。</p><div class="grid g3" style="margin-bottom:16px"><div class="card stat"><b>${S.words}</b><span>已學單字</span></div><div class="card stat"><b>${wk} 個</b><span>本週新學單字</span></div><div class="card stat"><b>${S.streak} 天</b><span>連續學習</span></div></div><div class="card" style="margin-bottom:16px"><h2>單字狀態</h2>${stH()}</div><div class="card"><h2>圖表與建議</h2><p class="mute">正確率、聽力與文法表現圖表，以及個人化建議，將於第 6 階段加入。</p></div>`}
function profile(){return `<h1>個人</h1><p class="mute" style="margin-bottom:20px">設定會自動儲存在這個裝置上。</p>
<div class="card" style="margin-bottom:16px"><div class="top" style="margin:0"><div class="av">${[...S.name][0]||'學'}</div><div><h2 style="margin:0">${esc(S.name)}</h2><span class="badge">${S.level} · ${S.xp} XP</span></div></div></div>
<div class="card"><h2>設定</h2>
<div class="field"><label for="nm">使用者名稱</label><input type="text" id="nm" maxlength="12" value="${esc(S.name)}"></div>
<div class="field"><label for="lv">英文程度</label><select id="lv">${LEVELS.map(l=>`<option ${l===S.level?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="field"><label for="gl">每日單字目標</label><select id="gl">${[5,10,20,30].map(g=>`<option value="${g}" ${g===S.goal?'selected':''}>${g} 個</option>`).join('')}</select></div>
<div class="field"><span id="dl">深色模式</span><button class="sw" id="dk" role="switch" aria-labelledby="dl" aria-checked="${isDark()}"></button></div>
<div class="field"><span>清除學習資料</span><button class="btn ghost" id="rs">重設</button></div></div>`}
function isDark(){return S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const CATS={daily:'日常英文',academic:'學術英文',business:'商業英文',toeic:'多益',travel:'旅遊英文',tech:'科技',science:'科學',eng:'工程',mech:'機械工程',auto:'汽車工程'};
const ST={NEW:'新單字',LEARNING:'學習中',REVIEW:'複習中',MASTERED:'已精熟'};
/* 欄位：單字|IPA(美式)|詞性|中文|英文定義|例句|中譯|搭配詞;分隔|同義|反義|相關|常見錯誤|級別|分類 */
const W=[
'family|/ˈfæməli/|名詞|家人、家庭|A group of people who are related to each other.|My family lives in Taipei.|我的家人住在台北。|a close family;family members;start a family|relatives|stranger|parent;sibling|複數是 families，不是 familys。|A1|daily',
'breakfast|/ˈbrekfəst/|名詞|早餐|The first meal of the day.|I have breakfast at seven every morning.|我每天早上七點吃早餐。|have breakfast;skip breakfast;a healthy breakfast|morning meal|dinner|lunch;dinner|泛指用餐時不加 a：說 have breakfast，不說 have a breakfast。|A1|daily',
'airport|/ˈerpɔːrt/|名詞|機場|A place where planes take off and land.|The airport is thirty minutes from the city.|機場離市區三十分鐘車程。|go to the airport;airport security;airport shuttle|airfield|—|flight;passport|介系詞用 at the airport（在機場），不用 in。|A1|travel',
'borrow|/ˈbɑːroʊ/|動詞|借入|To take something from someone and give it back later.|Can I borrow your pen?|我可以跟你借筆嗎？|borrow money;borrow a book;borrow from a friend|take on loan|lend|lend;return|borrow 是「借入」，lend 是「借出」，常被混用。|A2|daily',
'ticket|/ˈtɪkɪt/|名詞|票、車票|A piece of paper or a digital code that lets you travel or enter a place.|I bought two train tickets online.|我在網路上買了兩張火車票。|buy a ticket;a one-way ticket;a plane ticket|pass|—|passport;seat|拼字是 ticket，注意中間是 ck。|A2|travel',
'fuel|/ˈfjuːəl/|名詞|燃料|A substance burned to produce power or heat.|This car uses less fuel than my old one.|這輛車比我的舊車更省油。|fuel tank;fuel consumption;fuel efficiency|gas;petrol|—|engine;gasoline|fuel 為不可數名詞，不說 a fuel 或 fuels（指單一燃料時）。|A2|auto',
'delay|/dɪˈleɪ/|名詞／動詞|延誤；延遲|A period of time when something is late or postponed.|The flight was delayed by two hours.|班機延誤了兩小時。|a long delay;without delay;delay a decision|postpone|hurry|cancel;postpone|表示「被延誤」用 be delayed，不說 be delay。|A2|travel',

const stop=()=>{T.run++;if('speechSynthesis' in window)speechSynthesis.cancel();T.idx=-1};
function spk(t,cb){if(!('speechSynthesis' in window)){toast('此裝置不支援語音播放');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=T.sp;if(cb)u.onend=cb;speechSynthesis.speak(u)}
function rl(){if(route()==='learn'&&L.tab==='l')document.getElementById('main').innerHTML=learnV()}
function playAll(){const d=LD[T.id],r=++T.run;speechSynthesis&&speechSynthesis.cancel();(function n(k){if(r!==T.run)return;if(k>=d.l.length){T.idx=-1;rl();return}T.idx=k;rl();spk(d.l[k][0],()=>n(k+1))})(0)}
function listen(){if(!T.id)return `<h1>聽力中心</h1><p class='mute'>聽英文、對照字幕，再回答理解問題。目前開放 4 個單元，其餘陸續推出。</p>`+LL.map(([lv,a])=>`<h2 style='margin-top:20px'>${lv}</h2><div class='card'>${a.map(([t,id])=>{const r=S.ls&&S.ls[id];return id?`<button class='row rowb' data-gr='lopen' data-v='${id}'><span class='rb'><b>${t}</b><br><span class='mute' style='font-size:14px'>${LD[id].t}</span></span><span class='badge'>${r&&r.done?'已完成':'開始聆聽'}</span></button>`:`<button class='row rowb soon' data-gr='lsoon'><span class='rb'>${t}</span><span style='font-size:13px'>即將推出</span></button>`}).join('')}</div>`).join('');
const d=LD[T.id];if(T.qz)return lquiz(d);
return `<button class='btn ghost' data-gr='lback'>← 返回聽力列表</button><div class='card' style='margin-top:16px'><h1 style='font-size:22px'>${d.t}</h1><p class='mute'>${d.c}</p><div class='acts' style='margin:14px 0'><button class='btn' data-gr='lplay'>播放全部</button><button class='btn ghost' data-gr='lstep'>逐句播放（下一句）</button><button class='btn ghost' data-gr='lstop'>停止</button></div><div class='acts'>${[[.6,'慢速'],[.8,'中速'],[1,'正常']].map(([s,t])=>`<button class='chip' data-gr='lspeed' data-v='${s}' aria-pressed='${T.sp===s}'>${t}</button>`).join('')}<button class='chip' data-gr='lsub' aria-pressed='${T.sub}'>${T.sub?'隱藏字幕':'顯示字幕'}</button></div></div><div class='card' style='margin-top:16px'>${d.l.map(([en,zh],i)=>`<div class='row' style='${T.idx===i?'background:var(--sky);border-radius:10px;padding:0 8px':''}'><div class='rb'>${T.sub?`${en}<br><span class='mute' style='font-size:14px'>${zh}</span>`:`<span class='mute'>第 ${i+1} 句</span>`}</div><button class='ib' data-gr='lline' data-v='${i}' aria-label='重播第 ${i+1} 句'>重播</button></div>`).join('')}</div><button class='btn' style='margin-top:16px' data-gr='lquiz'>開始理解測驗</button>`}
function lquiz(d){const done=T.qz===2,n=T.qa.filter(x=>x!=null).length;return `<button class='btn ghost' data-gr='llesson'>← 返回單元</button><div class='card' style='margin-top:16px'><h1>理解測驗</h1><p class='mute'>${d.t}</p>${d.z.map((q,i)=>qv(q,i,T.qa[i],'lq',done)).join('')}${done?`<div class='sec'><h2>結果</h2><p><b>${T.sc} / ${d.z.length}</b>　${T.sc>=2?'通過！':'再聽一次再試試吧。'}本次獲得 ${T.gx} XP。</p><div class='acts' style='margin-top:8px'><button class='btn' data-gr='lquiz'>重新測驗</button><button class='btn ghost' data-gr='lback'>回到聽力列表</button></div></div>`:n===d.z.length?`<button class='btn' style='margin-top:14px' data-gr='lsubmit'>提交答案</button>`:`<p class='mute' style='margin-top:14px'>請回答所有題目後提交。</p>`}</div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-gr]');if(!b)return;const a=b.dataset.gr,v=b.dataset.v;if(a[0]!=='l')return;
if(a==='lsoon')return toast('這個單元尚未推出，敬請期待');
if(a==='lopen'){stop();T.id=v;T.qz=0}
else if(a==='lback'){stop();T.id=null;T.qz=0}
else if(a==='llesson'){T.qz=0}
else if(a==='lplay')return playAll();
else if(a==='lstop')stop();
else if(a==='lline'){stop();const r=T.run;T.idx=+v;spk(LD[T.id].l[+v][0],()=>{if(r===T.run){T.idx=-1;rl()}})}
else if(a==='lstep'){const n=T.idx+1>=LD[T.id].l.length?0:T.idx+1;stop();T.idx=n;spk(LD[T.id].l[n][0])}
else if(a==='lspeed')T.sp=+v;
else if(a==='lsub')T.sub=!T.sub;
else if(a==='lquiz'){stop();T.qz=1;T.qa=[]}
else if(a==='lq'&&T.qz===1){const[i,j]=v.split(':');T.qa[i]=+j}
else if(a==='lsubmit'){const d=LD[T.id];T.sc=d.z.filter((q,i)=>T.qa[i]===q.a).length;S.ls=S.ls||{};const r=S.ls[T.id]||(S.ls[T.id]={done:0,best:0});let x=0;if(T.sc>r.best){x=(T.sc-r.best)*2;r.best=T.sc}if(T.sc>=2&&!r.done){r.done=1;x+=10}S.xp+=x;T.gx=x;S.tasks[2]=true;act();save();T.qz=2}
rl();if(['lopen','lback','llesson','lquiz'].includes(a))window.scrollTo(0,0)});
let K={m:null,i:0,tx:'',res:null,rec:false,url:null,cv:null,st:0,hint:false,err:0};
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const EX=[['請用英文和人打招呼','Hello! Nice to meet you.'],['詢問對方來自哪裡','Where are you from?'],['說出你的早餐習慣','I have breakfast at seven every morning.'],['有禮貌地點一杯飲料','I’d like an orange juice, please.'],['請對方推薦餐廳','Can you recommend a good restaurant?'],['說明你的行程很滿','My schedule is full this week.']];
function tgt(){if(K.m==='w'){const x=W[K.i];return{en:x.w,zh:x.zh,ipa:x.ipa,key:'w:'+x.w}}if(K.m==='s'){const x=W[K.i];return{en:x.ex,zh:x.exzh,key:'s:'+x.w}}if(K.m==='x'){const e=EX[K.i];return{en:e[1],zh:e[0],key:'x:'+K.i}}const l=LD[K.cv].l[K.st];return{en:l[0],zh:l[1],key:'c:'+K.cv+':'+K.st}}
function kreset(){K.tx='';K.res=null;K.url=null;K.err=0;K.hint=false}
function ks(){if(route()==='learn'&&L.tab==='k')document.getElementById('main').innerHTML=learnV()}
function spkR(t,r){const o=T.sp;T.sp=r;spk(t);T.sp=o}
function kev(){const t=nrm(tgt().en),u=nrm(K.tx),miss=[...new Set(t.filter(w=>!u.includes(w)))];return{pct:Math.round((t.length-t.filter(w=>!u.includes(w)).length)/t.length*100),miss}}
function kfb(r){return r.pct>=90?'辨識結果和目標幾乎一致，做得很好！再試著用自然的語速和語調說一次。':r.pct>=60?`大部分的單字都被辨識出來了。請特別注意：${r.miss.join('、')}。先慢速聆聽示範，再模仿一次。`:'辨識結果和目標差異較大。先用慢速聆聽示範，逐字模仿，並確認麥克風靠近嘴巴、環境安靜。'}
async function recStart(){if(K.rec)return;kreset();
try{if(!(navigator.mediaDevices&&window.MediaRecorder))throw 0;K.stm=await navigator.mediaDevices.getUserMedia({audio:true});K.mr=new MediaRecorder(K.stm);K.ch=[];K.mr.ondataavailable=e=>K.ch.push(e.data);K.mr.onstop=()=>{K.url=URL.createObjectURL(new Blob(K.ch,{type:K.mr.mimeType||'audio/webm'}));K.stm.getTracks().forEach(t=>t.stop());ks()};K.mr.start()}catch(e){toast('無法使用麥克風，請允許瀏覽器的麥克風權限');return}
if(SRC){K.sr=new SRC();K.sr.lang='en-US';K.sr.interimResults=false;K.sr.onresult=e=>{K.tx=e.results[0][0].transcript;K.res=kev();const k=tgt().key;S.sp=S.sp||{};if(K.res.pct>=80&&!S.sp[k]){S.sp[k]=1;S.xp+=2;act();save();toast('+2 XP')}};K.sr.onerror=()=>{K.err=1};K.sr.onend=()=>{if(K.rec)recStop()};try{K.sr.start()}catch(e){}}
K.rec=true;ks()}
function recStop(){K.rec=false;try{if(K.mr&&K.mr.state!=='inactive')K.mr.stop()}catch(e){}try{if(K.sr)K.sr.stop()}catch(e){}ks()}
function kres(){if(K.err&&!K.res)return `<p class='mute' style='margin-top:12px'>沒有聽到清楚的語音。請靠近麥克風，在安靜的環境再試一次。</p>`;if(!K.res)return SRC||!K.url?'':`<p class='mute' style='margin-top:12px'>這個瀏覽器不支援語音辨識。請聆聽自己的錄音，和示範比較發音與節奏。</p>`;const r=K.res;return `<div class='sec'><h2>辨識結果</h2><p>系統聽到：「${esc(K.tx)}」</p><div class='bar'><div style='width:${r.pct}%'></div></div><p>吻合度約 ${r.pct}%</p><p style='margin-top:6px'>${kfb(r)}</p><p class='mute' style='font-size:13px;margin-top:8px'>這是根據語音辨識結果的粗略估計，不是正式的發音評分。口音、麥克風與環境噪音都會影響結果。</p></div>`}
function kpanel(t,hide){return `<div class='card' style='margin-top:16px'><div style='font-size:${t.en.length>24?22:30}px;font-weight:700;line-height:1.4'>${hide?`<span class='mute' style='font-size:18px;font-weight:400'>先聽示範，再試著說出來。</span>`:esc(t.en)}</div>${t.ipa&&!hide?`<p class='mute'>${t.ipa}</p>`:''}<p class='mute' style='margin-bottom:12px'>${t.zh}</p><div class='acts'><button class='btn ghost' data-gr='ksay'>播放示範</button><button class='btn ghost' data-gr='kslow'>慢速示範</button>${K.rec?`<button class='btn' style='background:var(--err);color:#fff' data-gr='kstop'>停止錄音</button>`:`<button class='btn' data-gr='kstart'>開始錄音</button>`}</div>${K.rec?`<p class='mute' style='margin-top:10px'>錄音中…請清楚地說出來。</p>`:''}${K.url?`<div class='sec'><h2>你的錄音</h2><audio controls src='${K.url}' style='width:100%'></audio></div>`:''}${kres()}</div>`}
function speak(){
if(!K.m)return `<h1>口說中心</h1><p class='mute' style='margin-bottom:12px'>跟著示範練習發音。錄音與語音辨識需要允許瀏覽器使用麥克風。</p><div class='card'>${[['w','單字發音','逐字聆聽示範並跟著說'],['s','句子發音','練習完整例句'],['x','口說練習','看中文提示，說出英文句子'],['c','對話練習','和對方輪流說，扮演對話角色']].map(([k,t,d])=>`<button class='row rowb' data-gr='kopen' data-v='${k}'><span class='rb'><b>${t}</b><br><span class='mute' style='font-size:14px'>${d}</span></span></button>`).join('')}</div>`;
const back=`<button class='btn ghost' data-gr='kback'>← 返回</button>`;
if(K.m==='c'){
if(!K.cv)return back+`<h1 style='margin-top:16px'>對話練習</h1><p class='mute'>對方說完後，輪到你說出回答。</p><div class='card' style='margin-top:12px'>${['greet','rest'].map(id=>`<button class='row rowb' data-gr='kcv' data-v='${id}'><span class='rb'><b>${LD[id].t}</b><br><span class='mute' style='font-size:14px'>${LD[id].c}</span></span></button>`).join('')}</div>`;
const l=LD[K.cv].l;
if(K.st>=l.length)return back+`<div class='card' style='margin-top:16px'><h1>對話完成</h1><p class='mute' style='margin:8px 0 14px'>你完成了這段對話。可以重新練習，或返回選擇其他對話。</p><button class='btn' data-gr='kcv' data-v='${K.cv}'>重新開始</button></div>`;
const mine=K.st%2===1,pg=`<p class='mute' style='margin-top:12px'>${LD[K.cv].t} · 第 ${K.st+1} / ${l.length} 句</p>`;
if(!mine)return back+pg+`<div class='card' style='margin-top:12px'><p class='mute'>對方說</p><p style='font-size:20px;font-weight:700'>${l[K.st][0]}</p><p class='mute'>${l[K.st][1]}</p><div class='acts' style='margin-top:12px'><button class='btn ghost' data-gr='ksay'>再聽一次</button><button class='btn' data-gr='kcont'>輪到我說</button></div></div>`;
return back+pg+kpanel(tgt(),!K.hint)+`<div class='acts' style='margin-top:12px'>${K.hint?'':`<button class='chip' data-gr='khint'>顯示提示</button>`}<button class='btn' data-gr='kcont'>下一句</button></div>`}
const n=K.m==='x'?EX.length:W.length;
return back+`<div class='wh' style='margin-top:12px'><span class='mute'>第 ${K.i+1} / ${n}</span><div class='acts'><button class='chip' data-gr='kprev'>上一個</button><button class='chip' data-gr='knext'>下一個</button></div></div>`+kpanel(tgt(),false)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-gr]');if(!b)return;const a=b.dataset.gr,v=b.dataset.v;if(a[0]!=='k')return;
if(a==='kopen'){K.m=v;K.i=0;K.cv=null;K.st=0;kreset()}
else if(a==='kback'){if(K.rec)recStop();if(K.m==='c'&&K.cv)K.cv=null;else K.m=null;kreset()}
else if(a==='kcv'){K.cv=v;K.st=0;kreset();spk(LD[v].l[0][0])}
else if(a==='kprev'||a==='knext'){const n=K.m==='x'?EX.length:W.length;K.i=(K.i+(a==='knext'?1:n-1))%n;kreset()}
else if(a==='ksay')return spk(tgt().en);
else if(a==='kslow')return spkR(tgt().en,.6);
else if(a==='kstart')return recStart();
else if(a==='kstop')return recStop();
else if(a==='khint')K.hint=true;
else if(a==='kcont'){K.st++;kreset();if(K.st<LD[K.cv].l.length&&K.st%2===0)spk(LD[K.cv].l[K.st][0])}
ks();if(['kopen','kback','kcv','kprev','knext','kcont'].includes(a))window.scrollTo(0,0)});
